[project]
name = "api"
version = "0.1.0"
description = "Praxis Agents OS backend API"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.19.1",
    "anyio>=4.14.2",
    "asyncpg>=0.31.0",
    "beautifulsoup4>=4.15.0",
    "croniter>=6.2.4",
    "cryptography>=50.0.0",
    "defusedxml==0.7.1",
    "fastapi>=0.141.1",
    "firecrawl-anydoc==0.2.4",
    "greenlet>=3.5.4",
    "httpx2==2.13.1",
    "logfire>=4.40.0",
    "markdownify>=1.2.3",
    "nh3>=0.2.20",
    "openpyxl==3.1.5",
    "pgvector==0.5.0",
    "prometheus-client>=0.26.0",
    "pwdlib[argon2]>=0.3.0",
    "pydantic-ai[retries]>=2.50.0",
    "pydantic-evals>=2.50.0",
    "pydantic-monty==1.0.0",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.14.0",
    "pyotp>=2.10.0",
    "python-docx==1.2.0",
    "python-pptx==1.0.2",
    "sqlalchemy>=2.0.51",
    "sqlglot>=30.0.0",
    "tenacity>=9.1.4",
    "tzdata>=2026.3",
    "uvicorn>=0.52.1",
]

[project.optional-dependencies]
azure = ["azure-identity>=1.17", "azure-keyvault-secrets>=4.8", "azure-storage-blob>=12.22"]
gcp = ["google-cloud-secret-manager>=2.30.0", "google-cloud-storage>=3.13.1"]
aws = ["boto3>=1.43.67"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.16.2",
    "watchfiles>=1.1.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["deferred_tools: keep deferred tool loading in runtime scenarios"]
