[project]
name = "api"
version = "0.1.0"
description = "Praxis Agents OS backend API"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.19.1",
    "asyncpg>=0.31.0",
    "beautifulsoup4>=4.15.0",
    "croniter>=6.2.4",
    "cryptography>=50.0.0",
    "fastapi>=0.141.1",
    "firecrawl-anydoc==0.1.8",
    "greenlet>=3.5.4",
    "httpx2>=2.10.0",
    "logfire>=4.40.0",
    "markdownify>=1.2.3",
    "nh3>=0.2.20",
    "pgvector==0.5.0",
    "prometheus-client>=0.26.0",
    "pwdlib[argon2]>=0.3.0",
    "pydantic-ai>=2.27.0",
    "pydantic-evals>=2.20.0",
    "pydantic-monty==0.0.21",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.13.0",
    "pyotp>=2.10.0",
    "sqlalchemy>=2.0.51",
    "tzdata>=2026.3",
    "uvicorn>=0.52.1",
]

[project.optional-dependencies]
azure = ["azure-identity>=1.17", "azure-keyvault-secrets>=4.8", "azure-storage-blob>=12.22"]
gcp = ["google-cloud-secret-manager>=2.30.0", "google-cloud-storage>=3.13.1"]
aws = ["boto3>=1.43.67"]

[dependency-groups]
dev = [
    "httpx>=0.28.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.16.2",
    "watchfiles>=1.1.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
