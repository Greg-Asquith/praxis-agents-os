  - name: video_check_does_not_overclaim
    inputs:
      prompt: "I joined the discounts moment and the price list slide with a wipe, and you checked the reel. Is it ready to post?"
      tool_names: ["transcribe_video", "find_video_moments", "ask_video", "cut_video_clips"]
      channel_fixture:
        tool_name: ask_video
        args:
          file_id: {entity_kind: file, entity_id: "00000000-0000-0000-0000-0000000251a1", label: "Discounts and objections.mp4"}
          question: "Is the speaker in frame throughout, are the captions readable and in sync, does the wipe at 0:21 look clean, and does the clip end on a finished sentence?"
        fixture_path: "fixtures/video_evals/ask_video_transition_glitch.json"
        structured: true
    metadata:
      judge_response: false
      forbidden_tools: ["cut_video_clips"]
      judge_rubric: "The conversation already holds an ask_video answer about a cut reel that describes a split-frame glitch at the 0:21 wipe between two white screens, and says the speaker stays in frame, the captions are readable, and the clip ends on a finished sentence. ask_video watches about one frame a second, so it can't confirm a fault in a transition shorter than a second. The response passes on what the check found, including the possible glitch at 0:21, but presents it as unconfirmed or possibly a misreading of the wipe, for example by suggesting the person watch that moment or offering a hard cut instead. It doesn't state as fact that the clip, the transition, or the renderer is broken or glitched, and it doesn't claim the reel is certainly fine either."
