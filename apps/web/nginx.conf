# apps/web/nginx.conf

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Vite fingerprints asset filenames, so they can cache forever.
    location /assets/ {
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/snippets/praxis-security-headers.conf;
    }

    # Never cache the shell, so a new deploy takes effect immediately.
    location = /index.html {
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/praxis-security-headers.conf;
    }

    # Public share links carry their token in the path, so they're never logged. A
    # fallback to /index.html would hand the request to the logged location above, so the
    # shell is served from here.
    location /share/ {
        access_log off;
        try_files /index.html =404;
        add_header Cache-Control "no-cache";
        add_header X-Robots-Tag "noindex, nofollow";
        include /etc/nginx/snippets/praxis-security-headers.conf;
    }

    # SPA fallback: unknown paths serve the app shell for client routing.
    location / {
        try_files $uri $uri/ /index.html;
        include /etc/nginx/snippets/praxis-security-headers.conf;
    }
}
