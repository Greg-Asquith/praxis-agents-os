name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: praxis
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/praxis
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/praxis_test
      ENVIRONMENT: local
      STORAGE_PROVIDER: local_fs
      EMAIL_PROVIDER: console
      SECRET_KEY: not-a-secret-ci-secret-key-change-me
      ENCRYPTION_KEY: bm90LWEtc2VjcmV0LWxvY2FsLWNpLWtleS0wMDAwMDA=
      SECURE_COOKIES: "false"
      SUPER_ADMIN_EMAILS: admin@example.com
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock
          prune-cache: true
      - run: uv sync --locked
      - name: Export OpenAPI schema
        run: uv run --locked python -c "import json, logging; logging.disable(logging.CRITICAL); from main import app; print(json.dumps(app.openapi()))" > openapi.json
      - name: Upload OpenAPI schema
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: openapi-spec
          path: apps/api/openapi.json
          if-no-files-found: error
      - run: uv run --locked ruff check .
      - run: uv run --locked ruff format --check .
      - run: uv run --locked alembic upgrade heads
      - run: uv run --locked alembic check
      - run: |
          uv run --locked python - <<'PY'
          import asyncio

          import asyncpg


          async def main() -> None:
              conn = await asyncpg.connect(
                  "postgresql://postgres:postgres@localhost:5432/postgres"
              )
              exists = await conn.fetchval(
                  "SELECT 1 FROM pg_database WHERE datname = $1", "praxis_test"
              )
              if not exists:
                  await conn.execute("CREATE DATABASE praxis_test")
              await conn.close()


          asyncio.run(main())
          PY
      - run: uv run --locked pytest

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          package_json_file: apps/web/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm check

  audit:
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock
          prune-cache: true
      - name: Audit API production dependencies
        working-directory: apps/api
        run: |
          uv export --quiet --locked --no-dev --format requirements-txt --output-file requirements-audit.txt
          uvx pip-audit --disable-pip --require-hashes -r requirements-audit.txt
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          package_json_file: apps/web/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Audit web production dependencies
        working-directory: apps/web
        run: pnpm audit --prod

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Build API production image
        run: docker build --target production --tag praxis-api-check apps/api
      - name: Build web production image
        run: docker build --target production --tag praxis-web-check apps/web
