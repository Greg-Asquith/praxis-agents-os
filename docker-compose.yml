# docker-compose.yml

x-api-environment: &api-environment
  OPENAI_API_KEY:
  ANTHROPIC_API_KEY:
  GOOGLE_API_KEY:
  AZURE_OPENAI_API_KEY:

x-api-volumes: &api-volumes
  - ./.local/generated:/config/generated:ro
  - ./.local/targets:/config/targets:ro
  - ./.local/data:/data

volumes:
  praxis-postgres-data:
    driver: local
  praxis-web-pnpm-node-modules:
    driver: local

networks:
  praxis-network:
    driver: bridge

services:
  init:
    image: python:3.12.10-slim
    command:
      - python
      - /workspace/apps/api/bin/bootstrap_local_env.py
      - --workspace
      - /workspace
    working_dir: /workspace
    volumes:
      - ./:/workspace
    restart: "no"

  postgres:
    image: pgvector/pgvector:pg17
    container_name: praxis-postgres
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --locale=C"
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - praxis-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
    restart: unless-stopped
    networks:
      - praxis-network

  migrate:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
      target: production
    command: ["sh", "/app/bin/compose_entrypoint.sh", "migrate"]
    volumes: *api-volumes
    environment: *api-environment
    networks:
      - praxis-network
    depends_on:
      init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
      target: production
    container_name: praxis-api
    command: ["sh", "/app/bin/compose_entrypoint.sh", "api"]
    ports:
      - "127.0.0.1:${PRAXIS_API_PORT:-8000}:8080"
    volumes: *api-volumes
    environment: *api-environment
    stop_grace_period: 120s
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8080/healthz', timeout=5)",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    restart: unless-stopped
    networks:
      - praxis-network
    depends_on:
      migrate:
        condition: service_completed_successfully

  worker:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
      target: production
    container_name: praxis-worker
    command: ["sh", "/app/bin/compose_entrypoint.sh", "worker"]
    volumes: *api-volumes
    environment: *api-environment
    healthcheck:
      disable: true
    stop_grace_period: 30s
    restart: unless-stopped
    networks:
      - praxis-network
    depends_on:
      migrate:
        condition: service_completed_successfully

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      target: production
      args:
        VITE_API_BASE_URL: ${PRAXIS_API_BASE_URL:-http://localhost:8000/api/v1}
        WEB_HTTPS_ONLY: "false"
    container_name: praxis-web
    ports:
      - "127.0.0.1:${PRAXIS_WEB_PORT:-3000}:8080"
    restart: unless-stopped
    networks:
      - praxis-network
    depends_on:
      api:
        condition: service_healthy
